name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static site
        run: npm run build

      - name: Verify static export
        run: test -f out/index.html

      - name: Build production image
        run: docker build --build-arg "BUILD_SHA=${GITHUB_SHA}" --tag nextweb:ci .

      - name: Verify image source label
        run: |
          image_sha="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' nextweb:ci)"
          test "$image_sha" = "${GITHUB_SHA}"
